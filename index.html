#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

<script>
/* ===== НАСТРОЙКИ: меняйте курс здесь (₽ за 1 USDT) ===== */
const RATE = 82.3, MIN = 10, HOUR = 3600e3;
const fr = n => Number(n).toLocaleString('ru-RU');
document.getElementById('rate-chip').textContent = '1 USDT = ' + fr(RATE) + ' ₽';
/* Сети и адреса для приёма USDT. */
const NETS = {
  TRC20: {name:'TRC20', sub:'TRON',      addr:'TUSSZRHDGW1pe66Ump1AYRkien2VaG2VPL', memo:false},
  TON:   {name:'TON',   sub:'TON',       addr:'UQAwi0T0XqI93ioCyr39iYPzSh0GRw01GCpDXVvI_9iZfEqX', memo:false},
  BEP20: {name:'BEP20', sub:'BNB Chain', addr:'0xb8aA166073Bd9763Cbd88Dffd870746C8cDb628a', memo:false}
};
const SUPPORT = 'qwymyX_support';
const LABEL = {awaiting:'Ожидает отправки USDT', processing:'В обработке', done:'Выполнен', cancelled:'Отменён'};

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor('#0E0B16'); tg.setBackgroundColor('#0E0B16'); }catch(e){} }

/* ---------- хранилище: Telegram CloudStorage (по аккаунту) или localStorage ---------- */
const useCloud = !!(tg && tg.initData && tg.CloudStorage);
const store = {
  get(){ return new Promise(res=>{
    try{
      if(useCloud) tg.CloudStorage.getItem('orders',(e,v)=>res(v?JSON.parse(v):[]));
      else res(JSON.parse(localStorage.getItem('orders')||'[]'));
    }catch(e){ res([]); }
  });},
  set(list){ let l = list.slice(0,25), v = JSON.stringify(l); while(v.length>3900 && l.length>1){ l.pop(); v = JSON.stringify(l); }
    try{ if(useCloud) tg.CloudStorage.setItem('orders', v); else localStorage.setItem('orders', v); }catch(e){}
  }
};

const rstore = {
  get(){ return new Promise(res=>{ try{
    if(useCloud) tg.CloudStorage.getItem('review',(e,v)=>res(v?JSON.parse(v):null));
    else res(JSON.parse(localStorage.getItem('review')||'null'));
  }catch(e){ res(null); } }); },
  set(v){ const s = JSON.stringify(v);
    try{ if(useCloud) tg.CloudStorage.setItem('review', s); else localStorage.setItem('review', s); }catch(e){} }
};

/* Отзывы клиентов, которые показываются всем. Добавляйте сюда настоящие отзывы:
   {name:'Алексей', stars:5, text:'Всё быстро, выплата пришла за 20 минут.', date:'09.11.2026'} */
const REVIEWS = [];

let myReview = null, editing = false, draft = {stars:0, text:''}, rerr = '';
let orders = [], tab = 'home', seg = 'current', openId = null;
let form = {usdt:'', bank:'', num:'', pname:'', net:'TON', step:1}, error = '';

/* Банки РФ: [название, цвет значка, цвет буквы]. Значки — цветные метки, не официальные логотипы. */
const BANKS = [
 ['Сбербанк','#21A038'],['Т-Банк','#FFDD2D','#111'],['ВТБ','#0A2896'],['Альфа-Банк','#EF3124'],
 ['Газпромбанк','#1F5FBF'],['Райффайзенбанк','#FEE600','#111'],['Россельхозбанк','#0B8F4C'],['Совкомбанк','#D9232D'],
 ['Банк Открытие','#00AEEF'],['ПСБ','#F26B21'],['Почта Банк','#1C4FA0'],['МТС Банк','#E30611'],
 ['Росбанк','#D4001F'],['ЮниКредит Банк','#D3002B'],['Ozon Банк','#005BFF'],['Яндекс Банк','#FC3F1D'],
 ['WB Банк','#CB11AB'],['Банк Санкт-Петербург','#C8102E'],['Ак Барс Банк','#00A651'],['Уралсиб','#00A0DF'],
 ['Хоум Банк','#E4002B'],['Русский Стандарт','#00833E'],['МКБ','#E3000F'],['Банк ДОМ.РФ','#FF6A13'],
 ['Авангард','#1B3C8C'],['Абсолют Банк','#00A0A0'],['Банк Зенит','#7B2D8E'],['Новикомбанк','#0057A8'],
 ['РНКБ','#0067B1'],['Локо-Банк','#1FA64A'],['Банк Синара','#00A3E0'],['Ренессанс Кредит','#F26522'],
 ['Экспобанк','#E2231A'],['Точка','#7040FF'],['Модульбанк','#00C389'],['ОТП Банк','#6EB43F'],
 ['Центр-инвест','#0079C1'],['Левобережный','#F39200'],['Тойота Банк','#EB0A1E'],['СДМ-Банк','#00A0B0'],
 ['Свой Банк','#FF6A00'],['Банк Финам','#003D7A'],['Фора-Банк','#E30613'],['Солидарность','#5B2C83'],
 ['Банк Оренбург','#0B6E4F'],['Датабанк','#0F6FC6'],['Хлынов','#1E7F4F'],['Кредит Европа Банк','#0C5DA5'],
 ['Дальневосточный банк','#E94E1B'],['Тинькофф Банк Бизнес','#FFDD2D','#111']
];
const bankLetter = n => n.replace(/^Банк\s+/,'').charAt(0).toUpperCase();
/* Логотипы: положите файлы в папку banks/ рядом с index.html (имя = название латиницей, например sberbank.png).
   Если файла нет, показывается цветной значок с буквой. */
const TR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
const bankSlug = n => n.toLowerCase().split('').map(c=>TR[c]!==undefined?TR[c]:c).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function bankIcon(name){
  const b = BANKS.find(x=>x[0]===name);
  const img = b ? `<img src="banks/${bankSlug(name)}.png" alt="" onload="this.parentNode.classList.add('has')" onerror="if(!this.dataset.t){this.dataset.t=1;this.src=this.src.replace('.png','.svg')}else{this.remove()}">` : '';
  return `<span class="bi" style="background:${b?b[1]:'#4B4560'};color:${b&&b[2]?b[2]:'#fff'}"><span>${esc(bankLetter(name))}</span>${img}</span>`;
}
function fillBanks(q){
  const raw = q.trim(), low = raw.toLowerCase();
  const list = BANKS.filter(b=>b[0].toLowerCase().includes(low));
  let html = list.map(b=>`<button class="bk" data-bank="${esc(b[0])}">${bankIcon(b[0])}<span>${esc(b[0])}</span></button>`).join('');
  if(!list.length && raw.length>=2){
    const name = raw.slice(0,30);
    html = `<button class="bk" data-bank="${esc(name)}">${bankIcon(name)}<span>Указать вручную: «${esc(name)}»</span></button>`;
  }
  $('#blist').innerHTML = html || '<div class="empty">Ничего не найдено</div>';
}
function openSheet(){
  const el = document.createElement('div'); el.id = 'sheet';
  el.innerHTML = `<button class="sh-back" data-sheet="close" aria-label="Закрыть"></button>

  }
  if(st===3){
    const digits = form.num.replace(/\D/g,'');
    if(!(digits.length===11 || (digits.length>=16 && digits.length<=19))){ error='Введите номер карты (16 цифр) или телефона (11 цифр).'; return render(); }
  }
  if(st===4 && !form.bank){ error='Выберите банк получателя.'; return render(); }
  if(st===5) return createOrder();
  error=''; form.step = st+1; render(); focusFirst();
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.matches && e.target.matches('#usdt,#num,#pname')){ e.preventDefault(); wizardNext(); }
});

document.addEventListener('input', e=>{
  if(e.target.id==='usdt'){
    form.usdt = e.target.value;
    const u = parseFloat(form.usdt.replace(',','.')) || 0;
    $('#get').innerHTML = rub(u*RATE)+' <small>₽</small>';
  }
  if(e.target.id==='num') form.num = e.target.value;
  if(e.target.id==='pname') form.pname = e.target.value;
  if(e.target.id==='bsearch') fillBanks(e.target.value);
  if(e.target.id==='rtext') draft.text = e.target.value;
});

document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-tg]');
  if(a){ e.preventDefault(); if(tg && tg.openTelegramLink) tg.openTelegramLink(a.href); else window.open(a.href,'_blank'); return; }
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.net){ form.net = t.dataset.net; render(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; openId=null; render(); return; }
  if(t.dataset.seg){ seg=t.dataset.seg; render(); return; }
  if(t.dataset.sheet==='close'){ closeSheet(); return; }
  if(t.dataset.bank!==undefined){ form.bank = t.dataset.bank; error=''; closeSheet(); if(form.step===4) form.step=5; render(); focusFirst(); return; }
  const id = +t.dataset.id, act = t.dataset.act;
  if(act==='copy') copy(t.dataset.v);
  else if(act==='support') openSupport();
  else if(act==='bank') openSheet();
  else if(act==='open'){ openId=id; render(); }
  else if(act==='back'){ openId=null; render(); }
  else if(act==='wnext') wizardNext();
  else if(act==='wback'){ error=''; form.step = Math.max(1,(form.step||1)-1); render(); focusFirst(); }
  else if(act==='star'){ draft.stars = +t.dataset.n; rerr=''; render(); }
  else if(act==='sendreview'){
    const text = draft.text.trim();
    if(draft.stars<1){ rerr='Поставьте оценку от 1 до 5.'; return render(); }
    if(text.length<3){ rerr='Напишите хотя бы пару слов.'; return render(); }
    rerr=''; myReview = {stars:draft.stars, text, ts:Date.now()}; rstore.set(myReview); editing=false; render();
    toast('Отзыв сохранён');
    openSupport('Отзыв '+stars(myReview.stars)+'\n'+text+'\n— '+userName());
  }
  else if(act==='editreview'){ draft = {stars:myReview.stars, text:myReview.text}; editing=true; rerr=''; render(); }
  else if(act==='resend'){ openSupport('Отзыв '+stars(myReview.stars)+'\n'+myReview.text+'\n— '+userName()); }
  else if(act==='paid'){ const o=update(id,{st:'processing', paid:Date.now()}); render(); if(o) openSupport(orderMessage(o)); }
  else if(act==='cancel'){ update(id,{st:'cancelled'}); openId=null; seg='history'; render(); }
  else if(act==='ask'){ const o=orders.find(x=>x.id===id); if(o) openSupport(orderMessage(o)); }
});

Promise.all([store.get(), rstore.get()]).then(([list, rv])=>{
  orders = Array.isArray(list)?list:[]; myReview = rv; if(!autoComplete()) render();
});
</script>
</body>
</html>
